name: Validate games
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:railway
      - run: npm run build:client
      - run: npx playwright install --with-deps chrome
      - name: Start installed client preview
        run: npm run preview:client -- --port 4173 > /tmp/jumbleyard-preview.log 2>&1 &
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: .tmp/platform-audit/browser-smoke.json
