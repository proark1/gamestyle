name: Validate games
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --import tsx --test scripts/peer-integration-runner.test.mjs
      - run: npm run build:railway
      - run: npm run build:client
      - run: npx playwright install --with-deps chrome firefox
      - name: Verify production routes, diagnostics and admin Health
        run: node scripts/ci-smoke.mjs production
      - name: Start installed client preview
        run: npm run preview:client -- --port 4173 > /tmp/jumbleyard-preview.log 2>&1 &
      - run: npm run test:browser
      - run: node --import tsx scripts/party-browser-integration.mjs
      - run: node --import tsx scripts/party-browser-integration.mjs four-brain-cells
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: .tmp/platform-audit
  browser-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: games
            engine: firefox
          - mode: games
            engine: webkit
          - mode: mobile
            engine: chromium
          - mode: mobile
            engine: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify every game in the selected browser
        run: |
          if [ "${{ matrix.engine }}" = "firefox" ]; then
            xvfb-run -a node scripts/ci-smoke.mjs ${{ matrix.mode }}
          else
            node scripts/ci-smoke.mjs ${{ matrix.mode }}
          fi
        env:
          SMOKE_ENGINE: ${{ matrix.engine }}
          SMOKE_BROWSER: chromium
          SMOKE_HEADLESS: ${{ matrix.engine != 'firefox' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.mode }}-${{ matrix.engine }}
          path: |
            .tmp/platform-audit
            .tmp/mobile-audit
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: node scripts/desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-diagnostics
          path: .tmp/platform-audit/desktop-smoke.json
  networking:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome firefox
      - run: npm run test:peer
      - run: npm run test:voice:browser -- --ui --interruptions
      - run: npm run test:voice:browser -- --early
      - run: npm run test:voice:browser -- --server-room=shelf-control
      - run: npm run test:voice:browser -- --server-room=chaos
      - run: npm run test:voice:browser -- --server-room=first-person
      - run: node --import tsx scripts/measure-peer-bandwidth.mjs
      - name: Start isolated TURN server
        run: docker run -d --name test-turn --network host coturn/coturn:4.18.0-r0-alpine -n --no-tls --fingerprint --lt-cred-mech --realm jumbleyard.test --user test:local-test-only --listening-ip 127.0.0.1 --relay-ip 127.0.0.1 --min-port 49160 --max-port 49259 --allow-loopback-peers --relay-threads=1
      - name: Verify forced relay gameplay and audio
        env:
          PEER_RELAY_ONLY: '1'
          PEER_TURN_URLS: turn:127.0.0.1:3478?transport=udp
          PEER_TURN_USERNAME: test
          PEER_TURN_CREDENTIAL: local-test-only
        run: npm run test:peer -- stack-or-sink
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-diagnostics
          path: |
            .tmp/improvements
            .tmp/voice
  firefox-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Start virtual audio for Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=jumbleyard_ci
          pactl set-default-sink jumbleyard_ci
      - name: Verify Firefox peer voice
        timeout-minutes: 3
        run: npm run test:voice:browser
        env:
          VOICE_TEST_ENGINE: firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-voice-diagnostics
          path: .tmp/voice
