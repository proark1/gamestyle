<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jumbleyard / The Host</title>
<style>
  @font-face{font-family:DM;src:url(../../../node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2);font-weight:700}
  @font-face{font-family:DM;src:url(../../../node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2);font-weight:400}
  *{box-sizing:border-box}body{margin:0;background:#e8eeed;color:#203c49;font:400 14px/1.45 DM,Arial,sans-serif}
  main{width:1100px;margin:0 auto;padding:34px 38px 48px}h1{font-size:30px;letter-spacing:-.04em;margin:0 0 4px}p{margin:0 0 24px;color:#5b7479}
  .canvas{background:linear-gradient(180deg,#d4edf0,#e1eeeb 68%,#f7f3e8);border-radius:16px;overflow:hidden;box-shadow:0 12px 32px #203c4917}
  header{height:95px;margin:0 56px;border-bottom:1px solid #203c4924;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:6px;color:#203c49;font-size:26px;font-weight:700;letter-spacing:-1.5px}.brand img{width:46px;height:46px}.note{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#5e7478}.nav{font-size:12px;font-weight:700}
  .hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:36px;padding:40px 56px 54px}.copy h2{max-width:430px;font-size:55px;line-height:1.02;letter-spacing:-.055em;margin:0 0 18px}.copy p{max-width:380px;font-size:16px}.button{display:inline-block;border-radius:999px;background:#1b718d;color:white;font-weight:700;padding:13px 22px}.art{display:grid;grid-template-columns:1fr 1fr;gap:12px}.art img{width:100%;height:235px;object-fit:cover;border-radius:12px}
  .specimens{display:flex;align-items:center;gap:30px;padding:28px 38px;background:white}.specimens h2{font-size:17px;letter-spacing:-.03em;margin:0 22px 0 0}.item{display:flex;align-items:center;gap:10px;color:#62767a;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}.item img{display:block}.large img{width:74px;height:74px}.medium img{width:48px;height:48px}.small img{width:32px;height:32px}
</style>
<main>
  <h1>The Host</h1><p>Selected Jumbleyard identity with the landing art and production icon exports.</p>
  <div class="canvas">
    <header><div class="brand"><img src="../../../public/images/brand/host-head.png" alt="">jumbleyard</div><div class="note">Party games for your crew</div><div class="nav">Pick a game ↓</div></header>
    <div class="hero"><div class="copy"><h2>Bring your friends. Make a little chaos.</h2><p>Party games built for the moments nobody planned.</p><span class="button">Pick a game</span></div><div class="art"><img src="../../../public/images/court-cast-v1/boys/reel-problems.jpg" alt=""><img src="../../../public/images/court-cast-v1/boys/stack-or-sink.jpg" alt=""></div></div>
    <div class="specimens"><h2>Icon sizes</h2><div class="item large"><img src="../../../public/images/brand/host-icon-192.png" alt="">74 px</div><div class="item medium"><img src="../../../public/images/brand/host-icon-192.png" alt="">48 px</div><div class="item small"><img src="../../../public/images/brand/host-icon-32.png" alt="">32 px</div></div>
  </div>
</main>
</html>
